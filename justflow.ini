; JustFlow app settings (this machine, every game). Game settings live in profiles\<game>.ini.
; F11 reloads both files. The tray "Hotkeys..." dialog writes [hotkeys] here.
; Keys from this file found in a profile are ignored (the log names them).

[app]
; startup profile: auto = the first profile whose game window is open, else wow, else the first; or a profile name (file stem)
profile=auto

[hotkeys]
; [Ctrl+][Alt+][Shift+]Key, Key = F1..F24 or a letter/digit
toggle=F9
wipe=F10
reload=F11
quit=Ctrl+F12
fg=F8
hud=F7

[ui]
; on-screen toast for state changes (effect/FG/wipe/reload/mask...): top-centre, 2 s. toast_scale = font pixel scale (4 = 32 px at 4K).
toast=1
toast_scale=4
; status HUD at start (F7 toggles): two lines of live counters in a corner (tl/tr/bl/br), hud_scale like toast_scale.
hud=1
hud_corner=tl
hud_scale=3

[overlay]
; composed = layered click-through window, always DWM-composed (one extra composition stage of latency).
; direct = no layered style, borderless window sized to the monitor so DWM can grant independent flip / MPO.
; Needs the capture to cover the monitor (DDA does). Click-through without the layered style is self-tested at startup;
; FAIL (Win11 26200: it never passes) keeps the monitor-sized window and adds the layered style -> direct_layered.
mode=composed
; DDA capture forces this on (the overlay would otherwise capture itself)
exclude_from_capture=0
reassert_topmost_every=300

[log]
; the log FILE is per profile ([log] file in profiles\<game>.ini)
stats_every=180
gpu_timestamps=1
; 1 = run the residual/compose_residual shader self-test once at startup (result in the log)
selftest=0

[ofa]
; optical-flow runtime override; empty = the driver's nvofapi64.dll
dll_path=

[nr]
; machine-level model-creation knobs, from Spike 0. create_style 0 = NeuralScreen parameter set, 1 = plain Width/Height.
; param_block 1 Allocate, 2 Capability, 3 Own. A profile with work=auto takes these from justflow.spike.ini instead.
create_style=1
param_block=1
