; nrfilter - external DLSS 5 neural rendering filter (capture -> NR -> overlay). F11 reloads this file.

[capture]
; dda = DXGI Desktop Duplication of the game's monitor (full refresh rate); wgc = window capture (60 Hz ceiling)
mode=dda
window_class=
window_title=Valheim
cursor=0
border=0

[nr]
enabled=1
; model size. auto = from spike results (nrfilter.spike.ini) or 2560x1440
work=2560x1440
; create_style 0 = NeuralScreen parameter set, 1 = plain Width/Height. param_block 1 Allocate, 2 Capability, 3 Own
create_style=1
param_block=1
; Look. Profiles: Faithful 0.6/0.3/0.6  Natural 1.0/0.5/1.0  Cinematic 1.4/0.8/1.2  Overdrive 2.0/1.0/2.0 (intensity/local_tone/local_structure)
preset=0
style=2
intensity=1.30
local_tone=0.70
local_structure=1.40
skin_structure=-1
auto_mask=1
ui_correction=1
exposure_scale=1.0
residual_strength=1.0
warmup=8
rebuild_debounce_frames=30
; cap the pipeline rate (0 = every captured frame). GPU-bound games: set to their real frame rate.
max_fps=90

[ofa]
input=960x540
grid=auto
cost_reject=0
zero_below=0.5
dll_path=

[ui]
; 4K pixel rects protected from the effect (x0,y0,x1,y1), up to rect16. Defaults: action bars, minimap, chat.
feather=12
; Valheim HUD: hotbar bottom-left, minimap top-right (4K coords)
rect1=0,1900,1400,2160
rect2=3300,0,3840,560

[overlay]
exclude_from_capture=0
reassert_topmost_every=300

[hotkeys]
toggle=F9
wipe=F10
reload=F11
quit=Ctrl+F12

[log]
file=nrfilter.valheim.log
stats_every=180
gpu_timestamps=1

[fg]
; F8 toggles. multiplier 2 = one generated frame per real frame
enabled=0
multiplier=2
