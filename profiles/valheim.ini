; JustFlow game profile (capture, model look, motion, UI rects, FG). App settings (hotkeys, toast/HUD, overlay,
; log stats) live in justflow.ini next to the exe. F11 reloads both.

[capture]
; dda = DXGI Desktop Duplication of the game's monitor (full refresh rate); wgc = window capture (60 Hz ceiling)
mode=dda
window_class=
window_title=Valheim
cursor=0
border=0

[nr]
enabled=1
; model size. auto = from spike results (justflow.spike.ini) or 2560x1440
work=1920x1080
; Look. Profiles: Faithful 0.6/0.3/0.6  Natural 1.0/0.5/1.0  Cinematic 1.4/0.8/1.2  Overdrive 2.0/1.0/2.0 (intensity/local_tone/local_structure)
preset=0
style=2
intensity=1.30
local_tone=0.70
local_structure=1.40
skin_structure=-1
auto_mask=1
ui_correction=1
exposure_scale=1.0
residual_strength=1.0
warmup=8
rebuild_debounce_frames=30
; pipeline rate cap. 0 = uncapped: every captured frame is processed (default). Set only if you want the filter to
; deliberately yield GPU time to a GPU-bound game; the startup toast and the HUD always show the cap in force.
max_fps=0
; sync = evaluate every frame; async = decoupled model thread, frames compose native + newest residual warped by their own motion
mode=sync
warp=1.0
model_max_fps=0

[ofa]
; 1080p gray = exact 2x2 block of 4K; grid 1 -> a 1920x1080 flow field, matching the 1080p model/mv
input=1920x1080
grid=auto
zero_below=0.5

[ui]
; 4K pixel rects protected from the effect (x0,y0,x1,y1), up to rect16. Defaults: action bars, minimap, chat.
feather=12
; addon UI-mask strip decoder (WoW only)
mask=0
; Valheim HUD: hotbar bottom-left, minimap top-right (4K coords)
; rect1=0,1900,1400,2160
; rect2=3300,0,3840,560

[fg]
; F8 toggles. multiplier 2 = one generated frame per real frame
enabled=0
multiplier=2
; vblank = each frame goes out on the vblank nearest its slot (240 Hz: 2 refreshes per frame at 60x2); timer = old CPU schedule
pacing=vblank
; DLSS-G motionVectorsDilated: 1 = use our dense field as-is (default), 0 = A/B (F11 rebuilds FG)
mv_dilated=1

[log]
file=justflow.valheim.log
