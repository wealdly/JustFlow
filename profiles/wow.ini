; JustFlow - external DLSS 5 neural rendering filter (capture -> NR -> overlay). F11 reloads this file.

[capture]
; dda = DXGI Desktop Duplication of the game's monitor (full refresh rate); wgc = window capture (60 Hz ceiling)
mode=dda
; retail 12.x uses class "waApplication Window"; empty = match on title only
window_class=
window_title=World of Warcraft
cursor=0
border=0

[nr]
enabled=1
; model size. auto = from spike results (justflow.spike.ini) or 2560x1440
work=auto
; create_style 0 = NeuralScreen parameter set, 1 = plain Width/Height. param_block 1 Allocate, 2 Capability, 3 Own
create_style=1
param_block=1
; Look. Profiles: Faithful 0.6/0.3/0.6  Natural 1.0/0.5/1.0  Cinematic 1.4/0.8/1.2  Overdrive 2.0/1.0/2.0 (intensity/local_tone/local_structure)
preset=0
style=1
intensity=1.00
local_tone=0.50
local_structure=1.00
skin_structure=-1
auto_mask=1
ui_correction=1
exposure_scale=1.0
residual_strength=1.0
warmup=8
rebuild_debounce_frames=30
; pipeline rate cap. 0 = uncapped: every captured frame is processed (default). Set only if you want the filter to
; deliberately yield GPU time to a GPU-bound game; the startup toast and the HUD always show the cap in force.
max_fps=0
; sync = evaluate the model every frame (compose waits for it). async = decoupled model thread on its own
; queue: every frame composes native + the newest residual (nr_out - nr_in) warped by that frame's motion.
mode=sync
; async: residual warp = this frame's motion vectors * warp (v1: not the motion accumulated since the model frame)
warp=1.0
; async: cap the model thread (0 = as fast as the leftover GPU allows)
model_max_fps=0
; contrast-adaptive sharpen (CAS-style) after the effect, 0 = off, 0.3-0.5 typical; UI rects are left alone. Live (F11).
sharpen=0.0

[ofa]
input=1920x1080
grid=auto
; 0 = off; N = zero the motion where the OFA cost (0..255, higher = less reliable) exceeds N. Feeds both NR and FG.
cost_reject=0
zero_below=0.5
dll_path=

[ui]
; 4K pixel rects protected from the effect (x0,y0,x1,y1), up to rect16. Defaults: action bars, minimap, chat.
feather=12
; JustFlow addon (addon\JustFlow): decode its UI-mask strip from the capture (top-left 520x4 px, hidden in the
; output) and protect the rects it publishes (up to 64) on top of rect1..rect16. mask_every = read the strip every N frames.
mask=1
mask_every=1
; on-screen toast for state changes (effect/FG/wipe/reload/mask...): top-centre, 2 s. toast_scale = font pixel scale (4 = 32 px at 4K).
toast=1
toast_scale=4
; status HUD (F7): two lines of live counters in a corner (tl/tr/bl/br), hud_scale like toast_scale.
hud=0
hud_corner=tr
hud_scale=3
; rect1=0,1960,3840,2160
; rect2=3440,0,3840,400
; rect3=0,1500,900,1960

[fg]
; DLSS frame generation on the composed frame (nvngx_dlssg.dll next to the exe). Experimental: flat
; depth, motion estimated from capture, UI rects get warped in generated frames. F8 toggles at runtime.
enabled=0
; presented frames per rendered frame, 2..4
multiplier=2
; vblank = each frame goes out on the vblank nearest its slot (monitor under the overlay); timer = CPU schedule (old path)
pacing=vblank
; DLSS-G motionVectorsDilated. 1 = take our dense field as-is (default); 0 = let DLSS-G dilate (no-op with flat depth). F11 rebuilds FG.
mv_dilated=1
; present phase: every scheduled present target shifted by this many ms (negative = earlier). Live (F11), no FG rebuild.
phase_ms=0.0
; 1 = anchor the generated frames one slot later (the first generated frame always gets a full slot after the
; model pass: smoother, +1 slot of latency). Live (F11).
anchor_delay_slots=0

[overlay]
; composed = layered click-through window, always DWM-composed (one extra composition stage of latency).
; direct = no layered style, borderless window sized to the monitor so DWM can grant independent flip / MPO.
; Needs the capture to cover the monitor (DDA does). Click-through without the layered style is self-tested at startup;
; FAIL (Win11 26200: it never passes) keeps the monitor-sized window and adds the layered style -> direct_layered.
mode=composed
exclude_from_capture=0
reassert_topmost_every=300

[hotkeys]
toggle=F9
wipe=F10
reload=F11
quit=Ctrl+F12
fg=F8
hud=F7

[log]
file=justflow.log
stats_every=180
gpu_timestamps=1
; 1 = run the residual/compose_residual shader self-test once at startup (result in the log)
selftest=0
