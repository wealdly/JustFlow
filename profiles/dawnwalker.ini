; JustFlow game profile (capture, model look, motion, UI rects, FG). App settings (hotkeys, toast/HUD, overlay,
; log stats) live in justflow.ini next to the exe. F11 reloads both.

[capture]
; dda = DXGI Desktop Duplication of the game's monitor (full refresh rate); wgc = window capture (60 Hz ceiling)
mode=dda
window_class=
window_title=Dawnwalker
cursor=0
border=0

[nr]
enabled=0
; model size. auto = from spike results (justflow.spike.ini) or 2560x1440
work=auto
; Look. The default keeps the game's own art and spends the model on detail: style 0 (Standard, the
; least restyling), local_tone low (it remaps tone and colour), local_structure full (it adds detail).
; Raise local_tone / style only when a shift in look is wanted: Natural style=1 local_tone=0.5,
; Cinematic style=2 local_tone=0.8 local_structure=1.2.
preset=0
style=0
intensity=1.00
local_tone=0.20
local_structure=1.00
skin_structure=-1
auto_mask=1
ui_correction=1
exposure_scale=1.0
residual_strength=1.0
; How much of the model's COLOUR change to keep. The model pulls saturation toward photoreal,
; which fights a stylised palette; its detail and lighting live in the luma and are kept either
; way. 1 = as the model made it, 0 = the game's colour exactly. Live (F11).
chroma=1.00
; Vibrance of the finished frame, applied last and never inside the UI rects. 1 = untouched. Live (F11).
saturation=1.00
warmup=8
rebuild_debounce_frames=30
; pipeline rate cap. 0 = uncapped: every captured frame is processed (default). Set only if you want the filter to
; deliberately yield GPU time to a GPU-bound game; the startup toast and the HUD always show the cap in force.
max_fps=0

[ofa]
input=960x540
grid=auto
zero_below=0.5

[ui]
; 4K pixel rects protected from the effect (x0,y0,x1,y1), up to rect16. Defaults: action bars, minimap, chat.
feather=12
; addon UI-mask strip decoder (WoW only)
mask=0
; Dawnwalker: no UI rects for the control test

[fg]
; DLSS frame generation on the composed frame (nvngx_dlssg.dll next to the exe). F8 toggles.
enabled=1
; presented frames per rendered frame, 2..4
multiplier=2

[log]
file=justflow.dawnwalker.log
