; JustFlow full-desktop profile: frame generation for everything on the primary monitor - browsers,
; video players, desktop apps - not one window. Pick "desktop" in the tray (it is never auto-picked).
; The overlay covers the monitor, is excluded from its own capture and lets every click through; the
; mouse cursor is drawn by Windows above it and keeps its own latency. Only changed frames count: a
; static desktop costs nothing, and an app repainting the same image is not interpolated.
; Protected (DRM) video - the Netflix app, a browser with hardware acceleration on - is blacked out by
; Windows in any capture, so it shows black here: switch profile or press F8 / quit while watching one.

[capture]
desktop=1
; dda = Desktop Duplication of the monitor (HDR desktops converted to SDR); wgc = monitor capture
mode=dda

[nr]
; video, when the neural layer is on (F9): the GPU is mostly idle (video decodes on its own engine) and
; the model runs once per distinct video frame (repeats are skipped): 42 ms apart at 24 fps, 33 at 30 - so it
; runs at full resolution (~15 ms at 4K). passes=2 is ~30 ms: 24 fps film only, and it squeezes frame generation.
; Tone and lighting stay at their defaults: that is where the look comes from.
work=100%
passes=1

[filters]
; for streamed video, when the filter layer is on (F6): deband the compression steps (on the capture, before
; the model), light RCAS
deband=1.0
sharpen=0.3
saturation=1.0

[fg]
; video: every refresh shows the in-between frame the video's own clock calls for (DLSS-G's, at 1/4
; steps; our own flow where DLSS-G declines), one frame late
engine=video
multiplier=2
